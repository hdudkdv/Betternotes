# Web hosting is deployed locally — do not run this on push to main.
#
#   powershell -File tool/deploy_web.ps1
#
# That script uploads both sites:
#   https://notis-notizbuecher.web.app
#   https://notis-2dee0.web.app
#
# This workflow stays as a manual fallback only.

name: Deploy Web

on:
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Flutter web and deploy both hosting sites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Check Firebase token
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Missing secret FIREBASE_TOKEN. Prefer local: powershell -File tool/deploy_web.ps1"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build web app
        run: flutter build web --release --base-href /app/

      - name: Copy into hosting/app
        run: |
          rm -rf hosting/app
          mkdir -p hosting/app
          cp -R build/web/. hosting/app/

      - name: Deploy Firebase Hosting (both sites)
        run: npx firebase-tools@13 deploy --only hosting:notis-notizbuecher,hosting:notis-2dee0 --project notis-2dee0 --non-interactive
        env:
          FIREBASE_TOKEN: ${{ env.FIREBASE_TOKEN }}
