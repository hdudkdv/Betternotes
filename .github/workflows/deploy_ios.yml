# =============================================================================
# Kostenloser iOS-Build (ohne Apple Developer Account)
# =============================================================================
#
# Dieser Workflow erzeugt eine unsignierte Runner.app (kein .ipa, keine Secrets).
#
# Nach dem Download von Runner.app.zip (Actions → Artifacts):
# 1) ZIP entpacken → Runner.app erhalten
# 2) Mit Sideloadly (Windows/macOS) oder AltServer/AltStore (macOS/iOS)
#    und deiner normalen kostenlosen Apple-ID auf ein iPhone/iPad installieren
# 3) Auf dem Gerät unter Einstellungen → Allgemein → VPN & Geräteverwaltung
#    dein Apple-ID-Profil vertrauen
#
# Hinweis: Kostenlose Sideloading-Installationen laufen typischerweise ~7 Tage
# und müssen danach neu signiert/installiert werden.
# =============================================================================

name: Deploy iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS app
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (Zulu 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: |
          flutter pub get
          flutter precache --ios

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Zip Runner.app
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found at $APP_PATH"
            ls -laR build/ios || true
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Runner.app.zip
          ls -lh Runner.app.zip

      - name: Upload Runner.app.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner.app
          path: Runner.app.zip
          if-no-files-found: error
          retention-days: 14
