# =============================================================================
# iOS IPA Build & Sign – GitHub Actions Workflow (Flutter)
# =============================================================================
#
# SCHRITT-FÜR-SCHRITT: GitHub Secrets anlegen
# -----------------------------------------------------------------------------
# Gehe zu: Repository → Settings → Secrets and variables → Actions
# → New repository secret
#
# Pflicht-Secrets:
#
# 1) BUILD_CERTIFICATE_BASE64
#    Base64-kodiertes Apple Distribution Zertifikat (.p12).
#
#    Terminal-Befehl (macOS / Linux / Git Bash unter Windows):
#      base64 -i Certificates.p12 | tr -d '\n' > certificate_base64.txt
#
#    Inhalt von certificate_base64.txt als Secret-Wert einfügen.
#    macOS optional direkt in die Zwischenablage:
#      base64 -i Certificates.p12 | pbcopy
#
# 2) P12_PASSWORD
#    Passwort, das du beim Export des .p12 aus dem Keychain gesetzt hast.
#
# 3) BUILD_PROVISION_PROFILE_BASE64
#    Base64-kodiertes Provisioning Profile (.mobileprovision).
#
#    Terminal-Befehl:
#      base64 -i Profile.mobileprovision | tr -d '\n' > profile_base64.txt
#
# 4) KEYCHAIN_PASSWORD
#    Beliebiges starkes Passwort für die temporäre CI-Keychain
#    (nur für diesen Runner, z. B. ein zufälliger String).
#
# 5) APPLE_TEAM_ID
#    Deine 10-stellige Apple Developer Team ID
#    (Apple Developer → Membership → Team ID).
#
# 6) PROVISIONING_PROFILE_NAME
#    Exakter Name des Provisioning Profiles (wie in Apple Developer
#    unter „Name“, nicht die UUID).
#    Beispiel: BetterNotes App Store
#
# Optional:
#
# 7) EXPORT_METHOD
#    Wenn nicht gesetzt: app-store
#    Mögliche Werte: app-store | ad-hoc | enterprise | development
#
# Bundle-ID dieses Projekts:
#   com.betternotes.betternotes
#
# Artefakt nach erfolgreichem Lauf:
#   Actions → Workflow-Run → Artifacts → ios-ipa
# =============================================================================

name: Deploy iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build & Sign IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          pod repo update
          pod install

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/provisioning.plist"
          PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/provisioning.plist")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PP_UUID}.mobileprovision"

          echo "Installed provisioning profile UUID: $PP_UUID"

      - name: Create ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          EXPORT_METHOD: ${{ secrets.EXPORT_METHOD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          data = {
              "method": os.environ.get("EXPORT_METHOD") or "app-store",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "manual",
              "compileBitcode": False,
              "stripSwiftSymbols": True,
              "provisioningProfiles": {
                  "com.betternotes.betternotes": os.environ["PROVISIONING_PROFILE_NAME"],
              },
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist"
          with path.open("wb") as f:
              plistlib.dump(data, f)
          print(path.read_text(encoding="utf-8"))
          PY

          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Configure Xcode manual signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail

          # Release.xcconfig wird vom Runner-Release-Target geladen.
          {
            echo "CODE_SIGN_STYLE = Manual"
            echo "CODE_SIGN_IDENTITY = iPhone Distribution"
            echo "DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}"
            echo "PROVISIONING_PROFILE_SPECIFIER = ${PROVISIONING_PROFILE_NAME}"
          } >> ios/Flutter/Release.xcconfig

          echo "Updated ios/Flutter/Release.xcconfig:"
          cat ios/Flutter/Release.xcconfig

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Locate IPA
        id: locate_ipa
        run: |
          set -euo pipefail
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "No .ipa found under build/ios/ipa"
            ls -laR build/ios || true
            exit 1
          fi
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "Found IPA: $IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ steps.locate_ipa.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup keychain and signing files
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" \
                "$RUNNER_TEMP/build_pp.mobileprovision" \
                "$RUNNER_TEMP/provisioning.plist" \
                "$RUNNER_TEMP/ExportOptions.plist"
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
