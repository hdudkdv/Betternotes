# =============================================================================
# Kostenloser iOS-Build (ohne Apple Developer Account)
# =============================================================================
#
# Dieser Workflow erzeugt eine unsignierte app-release.ipa (Payload/Runner.app).
#
# Nach dem Download von app-release.ipa (Actions → Artifacts):
# 1) Datei in Sideloadly (Windows/macOS) oder AltServer/AltStore öffnen
# 2) Mit deiner normalen kostenlosen Apple-ID auf ein iPhone/iPad installieren
# 3) Auf dem Gerät unter Einstellungen → Allgemein → VPN & Geräteverwaltung
#    dein Apple-ID-Profil vertrauen
#
# Hinweis: Kostenlose Sideloading-Installationen laufen typischerweise ~7 Tage
# und müssen danach neu signiert/installiert werden.
# =============================================================================

name: Deploy iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS app
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (Zulu 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: |
          flutter pub get
          flutter precache --ios

      - name: Build iOS (release, no codesign)
        run: |
          set -euo pipefail
          # Flutter stable still preflights Xcode signing and fails without a
          # Development Team, even with --no-codesign. Prepare the project,
          # then compile unsigned via xcodebuild.
          printf '\nCODE_SIGNING_ALLOWED=NO\nCODE_SIGNING_REQUIRED=NO\nCODE_SIGN_IDENTITY=\nDEVELOPMENT_TEAM=\n' >> ios/Flutter/Release.xcconfig
          flutter build ios --release --no-codesign --config-only
          # Keep app + CocoaPods resource bundles in one products dir.
          # CONFIGURATION_BUILD_DIR breaks [CP] Copy Pods Resources (ML Kit).
          xcodebuild \
            -quiet \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Compress Runner.app
        run: |
          set -euo pipefail
          APP_PATH="build/ios-derived/Build/Products/Release-iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found at $APP_PATH"
            ls -laR build/ios-derived/Build/Products || true
            exit 1
          fi

          rm -rf Payload app-release.ipa
          mkdir -p Payload
          # ditto preserves iOS framework symlinks better than cp -R
          ditto "$APP_PATH" Payload/Runner.app

          # IPA = ZIP with Payload/Runner.app at archive root
          zip -qry app-release.ipa Payload

          # Sanity checks for Sideloadly / IPA tools
          unzip -l app-release.ipa | grep -E "Payload/Runner\.app/Info\.plist"
          /usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' \
            Payload/Runner.app/Info.plist
          ls -lh app-release.ipa

      - name: Upload app-release.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.ipa
          if-no-files-found: error
          retention-days: 14
