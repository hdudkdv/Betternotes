# Signiertes iOS-Release → App Store Connect / TestFlight
#
# Xcode Automatic Signing does not work on GitHub runners: the Connect
# API key is valid for uploads, but Xcode's listTeams endpoint returns 401.
# Fastlane cert/sigh talks to the official API and we sign manually.
#
# Secrets:
#   APPLE_TEAM_ID
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_KEY     (AuthKey_XXXX.p8 contents)
#   KEYCHAIN_PASSWORD             (optional; a temp password is used if empty)
#
# API key role must be Admin so Fastlane can create a Distribution cert
# and an App Store profile. App de.notis.app must already exist.

name: Deploy iOS App Store

on:
  workflow_dispatch:

concurrency:
  group: deploy-ios-appstore
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Signed IPA and upload
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"

    steps:
      - name: Check App Store Connect secrets
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets under GitHub → Settings → Secrets, then re-run this workflow."
            exit 1
          fi
          if [ -z "${KEYCHAIN_PASSWORD}" ]; then
            KEYCHAIN_PASSWORD="notis-ci-$(openssl rand -hex 8)"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (Zulu 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Install Flutter dependencies
        run: |
          flutter pub get
          flutter precache --ios

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          KEY_BODY=$(printf '%s\n' "$APP_STORE_CONNECT_API_KEY" | tr -d '\r')
          if printf '%s\n' "$KEY_BODY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$KEY_BODY" > "$KEY_PATH"
          else
            {
              echo "-----BEGIN PRIVATE KEY-----"
              printf '%s\n' "$KEY_BODY" | tr -d '\n' | fold -w 64
              echo
              echo "-----END PRIVATE KEY-----"
            } > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Create signing keychain
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Prepare iOS project
        run: |
          set -euo pipefail
          printf '\nDEVELOPMENT_TEAM=%s\n' "$APPLE_TEAM_ID" >> ios/Flutter/Release.xcconfig
          flutter build ios --release --config-only

      - name: Fetch Distribution cert and App Store profile
        working-directory: ios
        run: bundle exec fastlane ci_signing

      - name: Allow codesign to use the keychain
        run: |
          set -euo pipefail
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Write manual export options
        run: |
          set -euo pipefail
          EXPORT=ios/ExportOptions-appstore.plist
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict/>' \
            '</plist>' > "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :method string app-store" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string Apple Distribution" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:de.notis.app string $SIGH_NAME" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :compileBitcode bool false" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :stripSwiftSymbols bool true" "$EXPORT"

      - name: Archive and export signed IPA
        run: |
          set -euo pipefail
          mkdir -p build/ios/archive build/ios/ipa
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$SIGH_NAME" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions-appstore.plist \
            -exportPath "$PWD/build/ios/ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: notis-appstore-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        run: |
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "Uploading $IPA"
          xcrun altool --upload-app --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
