# Signiertes iOS-Release → App Store Connect / TestFlight
#
# Einmalig in GitHub → Settings → Secrets and variables → Actions:
#   APPLE_TEAM_ID
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_KEY     (Inhalt der AuthKey_XXXX.p8)
#
# In App Store Connect vorher die App mit Bundle-ID de.notis.app anlegen.
# API-Key: Users and Access → Integrations → App Store Connect API
# (Rolle Admin oder App Manager — sonst kann Xcode kein Profil anlegen).

name: Deploy iOS App Store

on:
  workflow_dispatch:

concurrency:
  group: deploy-ios-appstore
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Signed IPA and upload
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

    steps:
      - name: Check App Store Connect secrets
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets under GitHub → Settings → Secrets, then re-run this workflow."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (Zulu 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: |
          flutter pub get
          flutter precache --ios

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          KEY_BODY=$(printf '%s\n' "$APP_STORE_CONNECT_API_KEY" | tr -d '\r')
          if printf '%s\n' "$KEY_BODY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$KEY_BODY" > "$KEY_PATH"
          else
            {
              echo "-----BEGIN PRIVATE KEY-----"
              printf '%s\n' "$KEY_BODY" | tr -d '\n' | fold -w 64
              echo
              echo "-----END PRIVATE KEY-----"
            } > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          echo "Wrote $KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Set Xcode team for automatic signing
        run: |
          set -euo pipefail
          printf '\nDEVELOPMENT_TEAM=%s\nCODE_SIGN_STYLE=Automatic\n' "$APPLE_TEAM_ID" >> ios/Flutter/Release.xcconfig
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ios/ExportOptions-appstore.plist \
            || /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" ios/ExportOptions-appstore.plist

      - name: Prepare iOS project
        run: flutter build ios --release --config-only

      - name: Archive and export signed IPA
        run: |
          set -euo pipefail
          AUTH=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$ASC_KEY_PATH"
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID"
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          )
          mkdir -p build/ios/archive build/ios/ipa
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions-appstore.plist \
            -exportPath "$PWD/build/ios/ipa" \
            "${AUTH[@]}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: notis-appstore-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        run: |
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "Uploading $IPA"
          xcrun altool --upload-app --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
