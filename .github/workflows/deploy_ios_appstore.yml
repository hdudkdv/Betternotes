# Signiertes iOS-Release → App Store Connect / TestFlight
#
# Automatic signing and Fastlane cert both fail here: Apple rejects the
# Connect API key for portal/cert APIs (401 / invalid bearer).
# Sign with a Distribution .p12 and App Store profile instead.
#
# Secrets:
#   APPLE_TEAM_ID
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_KEY
#   BUILD_CERTIFICATE_BASE64      (base64 of the .p12)
#   BUILD_PROVISION_PROFILE_BASE64
#   P12_PASSWORD
#   KEYCHAIN_PASSWORD             (optional)

name: Deploy iOS App Store

on:
  workflow_dispatch:

concurrency:
  group: deploy-ios-appstore
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Signed IPA and upload
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Check signing secrets
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_KEY BUILD_CERTIFICATE_BASE64 BUILD_PROVISION_PROFILE_BASE64 P12_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Create the Apple Distribution cert + App Store profile in the Developer portal, then add the secrets."
            exit 1
          fi
          if [ -z "${KEYCHAIN_PASSWORD}" ]; then
            KEYCHAIN_PASSWORD="notis-ci-$(openssl rand -hex 8)"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (Zulu 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: |
          flutter pub get
          flutter precache --ios

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          KEY_BODY=$(printf '%s\n' "$APP_STORE_CONNECT_API_KEY" | tr -d '\r')
          if printf '%s\n' "$KEY_BODY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$KEY_BODY" > "$KEY_PATH"
          else
            {
              echo "-----BEGIN PRIVATE KEY-----"
              printf '%s\n' "$KEY_BODY" | tr -d '\n' | fold -w 64
              echo
              echo "-----END PRIVATE KEY-----"
            } > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"

      - name: Import certificate and provisioning profile
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "SIGH_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Imported profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Prepare iOS project
        run: |
          set -euo pipefail
          # Flutter still looks for an iOS Development cert unless we skip
          # codesign. Distribution signing happens in the archive step.
          printf '\nDEVELOPMENT_TEAM=%s\n' "$APPLE_TEAM_ID" >> ios/Flutter/Release.xcconfig
          flutter build ios --release --no-codesign --config-only
          # Runner-only. Do not pass PROVISIONING_PROFILE_SPECIFIER to
          # xcodebuild — that leaks the app profile onto Pods and SPM packages.
          {
            echo "CODE_SIGN_STYLE=Manual"
            echo "CODE_SIGN_IDENTITY=Apple Distribution"
            echo "PROVISIONING_PROFILE_SPECIFIER=$SIGH_NAME"
          } >> ios/Flutter/Release.xcconfig

      - name: Write manual export options
        run: |
          set -euo pipefail
          EXPORT=ios/ExportOptions-appstore.plist
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict/>' \
            '</plist>' > "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :method string app-store" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string Apple Distribution" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:de.notis.app string $SIGH_NAME" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :compileBitcode bool false" "$EXPORT"
          /usr/libexec/PlistBuddy -c "Add :stripSwiftSymbols bool true" "$EXPORT"

      - name: Archive and export signed IPA
        run: |
          set -euo pipefail
          mkdir -p build/ios/archive build/ios/ipa
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions-appstore.plist \
            -exportPath "$PWD/build/ios/ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: notis-appstore-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        run: |
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "Uploading $IPA"
          xcrun altool --upload-app --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
